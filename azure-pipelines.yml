trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  serviceConnection: 'azure-terraform-learning'

stages:
- stage: Plan
  displayName: 'Terraform Plan'
  jobs:
  - job: Plan
    steps:
    - template: install-terraform.yml

    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan

    - publish: tfplan
      artifact: tfplan

- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  jobs:
  - deployment: Apply
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - template: install-terraform.yml

          - download: current
            artifact: tfplan

          - task: AzureCLI@2
            displayName: 'Terraform Init and Apply'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                terraform init -input=false
                terraform apply -input=false $(Pipeline.Workspace)/tfplan/tfplan